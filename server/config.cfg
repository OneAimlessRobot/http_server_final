defaultTarget=/webcrookedstuff
mainRssFeed=/webcrookedstuff/rss/the_main_rss.rss
notFoundDefaultTarget=/file_not_found.html
logging=1
use_valgrind=0
use_chunked=0
ignore_partial=0
use_compression=1
compression_level=6
smalltimeoutsecs=0
smalltimeoutusecs=100000
bigtimeoutsecs=0
bigtimeoutusecs=600000
tls_shake_timeout_secs=
tls_shake_timeout_usecs=700000
tls_data_timeout_secs=0
tls_data_timeout_usecs=100000
port=11020
recv_socket_size=100000000
send_socket_size=100000000
use_tls=1
host_cert_file_path=.cert_stuff/fancy/fullchain.pem
host_pkey_file_path=.cert_stuff/fancy/privkey.pem
